services:
  - type: web
    name: hybrid-store
    runtime: python
    branch: developer
    buildCommand: pip install -r backend/requirements.txt && python backend/seed_data.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: DEBUG
        value: "false"
      - key: GOOGLE_CLIENT_ID
        value: "223634301957-1di4nvebgc2ne34kqa0gb3l321de00j4.apps.googleusercontent.com"
