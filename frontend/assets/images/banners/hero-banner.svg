<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="60%" stop-color="#121124" />
      <stop offset="100%" stop-color="#1e1838" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="300" r="220" fill="#06b6d4" opacity="0.12" filter="blur(60px)" />

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Content Left -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="20" y="22" fill="#06b6d4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="1">⚡ SÀN THƯƠNG MẠI ĐIỆN TỬ HYBRID</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="0.5">
      MALL CHÍNH HÃNG &amp;
    </text>
    <text x="0" y="145" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="0.5">
      CHỢ ĐỒ CŨ ĐỒNG KIỂM 100%
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="18">
      Định danh CCCD chính chủ • Thanh toán Napas 24/7 tự động • Đổi trả miễn phí 7 ngày
    </text>
  </g>

  <!-- Geometric Illustration Right -->
  <g transform="translate(940, 200)">
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="none" stroke="url(#glowGrad)" stroke-width="4" />
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#06b6d4" />
  </g>
</svg>
