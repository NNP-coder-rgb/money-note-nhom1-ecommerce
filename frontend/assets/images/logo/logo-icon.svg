<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0f0f1b" stroke="url(#primaryGrad)" stroke-width="2" />
  <!-- Center Hexagon Symbol -->
  <polygon points="24,10 37,17.5 37,32.5 24,40 11,32.5 11,17.5" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Inner Node Point -->
  <circle cx="24" cy="24" r="4.5" fill="url(#primaryGrad)" filter="url(#glow)" />
  <line x1="24" y1="10" x2="24" y2="19.5" stroke="#06b6d4" stroke-width="2" />
  <line x1="37" y1="32.5" x2="28" y2="27" stroke="#8b5cf6" stroke-width="2" />
  <line x1="11" y1="32.5" x2="20" y2="27" stroke="#6366f1" stroke-width="2" />
</svg>
