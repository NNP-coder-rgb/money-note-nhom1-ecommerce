version: '3.8'

services:
  # 1. Ứng dụng Web FastAPI Backend & Frontend Static Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_store_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=hybrid_password_2026
      - DB_NAME=hybrid_store_db
      - USE_SQLITE_FALLBACK=true
      - SECRET_KEY=hybrid-store-production-jwt-secret-key-2026
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
      - sqlite_data:/app/backend/database

  # 2. Máy chủ Cơ sở Dữ liệu MySQL 8.0
  db:
    image: mysql:8.0
    container_name: hybrid_store_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=hybrid_password_2026
      - MYSQL_DATABASE=hybrid_store_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phybrid_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  sqlite_data:
  uploads_data:
